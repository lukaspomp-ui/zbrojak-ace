workflows:
  ios-app-store:
    name: Zbrojní průkaz 2026 — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Zbrojak 2026
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cz.zbrojak2026.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies and build web app
        script: |
          npm install -g bun
          bun install
          bun run build
      - name: Generate iOS project
        script: |
          npx cap add ios || true
          npx cap sync ios
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = cz.zbrojak2026.app;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
