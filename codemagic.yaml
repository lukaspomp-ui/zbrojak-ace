workflows:
  ios-app-store:
    name: Zbrojní průkaz 2026 — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 9MX3F3Z65K
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cz.zbrojak2026.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cz.zbrojak2026.app"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install
      - name: Generate iOS project (Capacitor)
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Generate app icons and splash screens
        script: |
          npx capacitor-assets generate --ios \
            --assetPath mobile/assets \
            --iosProject ios/App
      - name: Set bundle ID and version
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Install pods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Build and archive
        script: |
          xcode-project use-profiles
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/Zbrojak.xcarchive \
            -destination 'generic/platform=iOS' \
            archive
      - name: Export IPA
        script: |
          xcode-project build-ipa --archive-path build/Zbrojak.xcarchive
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
