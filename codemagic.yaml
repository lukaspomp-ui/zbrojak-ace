workflows:
  ios-app-store:
    name: Zbrojní průkaz 2026 — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Zbrojak 2026
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cz.zbrojak2026.app"
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies and build web app
        script: |
          npm install -g bun
          bun install
          bun run build
      - name: Regenerate and sync iOS project
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Set bundle ID and version
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Fetch and create signing profiles
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
