workflows:
  ios-app-store:
    name: Zbrojní průkaz 2026 — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Zbrojak 2026"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cz.zbrojak2026.app"
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies and build web app
        script: |
          npm install -g bun
          bun install
          bun run build
      - name: Generate iOS project
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Configure Xcode project settings
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/App/App.xcodeproj/project.pbxproj
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Fetch certificates, extract Team ID and apply profiles
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type
